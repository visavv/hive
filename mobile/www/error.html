<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>hive</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <!-- Shown by the app when the hive address doesn't load (Tailscale off, computer asleep, hive web not running). -->
    <main id="offline">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 56 18v28L32 60 8 46V18z" /></svg>
      <h1>Can't reach hive</h1>
      <p>Check that the Tailscale app is connected, the computer is awake, and <code>hive web</code> is running there.</p>
      <p class="hint" id="where"></p>
      <button id="retry" type="button">Try again</button>
      <button id="change" type="button" class="ghost">Change address</button>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
