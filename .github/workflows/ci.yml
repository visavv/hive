name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: doctor (adapters spawn and answer initialize)
        run: node dist/cli/index.js doctor claude codex mock
      - name: Windows installer script (what you run at home)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -SkipPrereqs -NoPull -NoLaunch -Project "$env:GITHUB_WORKSPACE"
      - name: hive is on PATH after install
        if: runner.os == 'Windows'
        shell: powershell
        run: hive.cmd doctor mock
      - name: remote-access setup (dry run)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then powershell -ExecutionPolicy Bypass -File scripts/setup-remote-windows.ps1 -DryRun -TailscaleOnly
          else bash scripts/setup-remote.sh --dry-run --discord --daemon --ssh-only-tailscale; fi
      - name: UI e2e (Windows)
        if: runner.os == 'Windows'
        run: npm run test:ui
        env:
          SHOT_DIR: ${{ github.workspace }}/shots
      - name: UI e2e (Linux, xvfb)
        if: runner.os == 'Linux'
        run: node scripts/build-ui.mjs && xvfb-run -a -s "-screen 0 1920x1080x24" npx tsx test/ui.ts
        env:
          SHOT_DIR: ${{ github.workspace }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: shots/
          if-no-files-found: ignore

  fedora:
    # The Fedora laptop: full suite + the Electron UI test in a Fedora container.
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 30
    steps:
      - name: system packages
        run: dnf install -y nodejs npm git gcc-c++ make python3 procps-ng which xorg-x11-server-Xvfb gtk3 nss alsa-lib libXScrnSaver mesa-libgbm libdrm libxkbcommon at-spi2-atk cups-libs dbus-x11
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*' && git config --global user.email ci@example.com && git config --global user.name ci && node -v
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: doctor
        run: node dist/cli/index.js doctor claude codex mock
      - name: desktop entry
        run: node dist/cli/index.js desktop --cwd "$PWD" && cat ~/.local/share/applications/hive-*.desktop
      - name: remote-access setup (dry run, Fedora)
        run: bash scripts/setup-remote.sh --dry-run --discord --daemon --ssh-only-tailscale
      - name: UI e2e (Xvfb)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          node scripts/build-ui.mjs
          DISPLAY=:99 npx tsx test/ui.ts
        env:
          SHOT_DIR: ${{ github.workspace }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-fedora
          path: shots/
          if-no-files-found: ignore
